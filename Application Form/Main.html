<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="grid-container">
        <section class="top-section">

            <div class="heading"> 
                <img src="logo.png" alt="YMCA LOGO" class="logo">
                <h1>JC BOSE UNIVERSITY</h1>
            </div>

        </section>
        <section class="flex-section" id="bottom-section">
            <section class="left-section">
                <div>

                    <nav>
                        <ul>
                            <li><a href="#home">Home</a></li>
                            <li><a href="#about">About</a></li>
                            <li><a href="#contact">Contact</a></li>
                            <li><a href="#appform">Application Form</a></li>
                        </ul>
                    </nav>

                </div>
            </section>
            
            <section class="right-section">
                <div class="form heading"><h1>APPLICATION FORM</h1></div>

                    <table class="Application form">
                        <form action="">
                            <tr>
                                <td>
                                    <label for="name">Name:</label>
                                </td>
                                <td>
                                    <input type="text" id="name" name="name">
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="email">Email:</label>
                                </td>
                                <td>
                                    <input type="email" id="email" name="email">
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="phone">Phone:</label>
                                </td>
                                <td>
                                    <input type="tel" id="phone" name="phone">
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="address">Address:</label>
                                </td>
                                <td>
                                    <input type="text" id="address" name="address">
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="Gender">Gender:</label>
                                </td>
                                <td>
                                    <select id="Gender" name="Gender">
                                        <option value="male">Male</option>
                                        <option value="female">Female</option>
                                        <option value="other">Other</option>
                                    </select>
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="dob">Date of Birth:</label>
                                </td>
                                <td>
                                    <input type="date" id="dob" name="dob">
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <label for="Aadhar">Aadhar Number:</label>
                                </td>
                                <td>
                                    <input type="text" id="Aadhar" name="Aadhar">
                                </td>
                            </tr>
                            <tr>
                                <td colspan="2" style="text-align: center;">
                                    <input type="submit" id="Submit" name="Submit">
                                </td>
                            </tr>
                        </form>
                    </table>



            </section>
        </section>
        
       
    
    </div>
    
</body>
</html>
